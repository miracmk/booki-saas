name: Build iOS IPA

on:
  push:
    paths:
      - 'apps/ki-reservation-mobile/**'
      - '.github/workflows/build-ios.yml'
    branches: [ main ]
  pull_request:
    paths:
      - 'apps/ki-reservation-mobile/**'
    branches: [ main ]
  workflow_dispatch:
    inputs:
      flutter_channel:
        description: 'Flutter Channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ki-reservation-mobile

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel || 'stable' }}
          cache: true

      - name: 🩺 Flutter Doctor
        run: flutter doctor -v

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🧪 Run Automated Tests
        run: flutter test

      - name: 🍎 CocoaPods Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔨 Build iOS (Release, Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: 📦 Package into .ipa Bundle
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q BooKi-iOS-unsigned.ipa Payload
          echo "IPA bundle successfully created at build/ios/ipa/BooKi-iOS-unsigned.ipa"
          ls -lh BooKi-iOS-unsigned.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooKi-iOS-IPA
          path: apps/ki-reservation-mobile/build/ios/ipa/BooKi-iOS-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
