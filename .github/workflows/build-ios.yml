name: Build iOS IPA

on:
  push:
    paths:
      - 'apps/ki-reservation-mobile/**'
      - '.github/workflows/build-ios.yml'
    branches: [ main ]
  pull_request:
    paths:
      - 'apps/ki-reservation-mobile/**'
    branches: [ main ]
  workflow_dispatch:
    inputs:
      flutter_channel:
        description: 'Flutter Channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    defaults:
      run:
        working-directory: apps/ki-reservation-mobile


    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel || 'stable' }}
          cache: true

      - name: 🩺 Flutter Doctor
        run: flutter doctor -v

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🧪 Run Automated Tests
        run: flutter test

      - name: 🔨 Build iOS (Release, Unsigned Device IPA)
        run: |
          flutter build ios --release --no-codesign

      - name: 📦 Package into .ipa Bundle
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q BooKi-iOS-unsigned.ipa Payload
          echo "IPA bundle successfully created at build/ios/ipa/BooKi-iOS-unsigned.ipa"
          ls -lh BooKi-iOS-unsigned.ipa

      - name: 🌐 Build iOS Simulator for Appetize.io (.zip & .tar.gz)
        run: |
          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r -y -q booki-appetize-iOS.zip Runner.app
          ln -sf booki-appetize-iOS.zip BooKi-Appetize-iOS-Simulator.zip
          tar -czf booki-appetize-iOS.tar.gz Runner.app
          echo "Appetize.io Simulator bundles created"
          ls -lh booki-appetize-iOS.zip booki-appetize-iOS.tar.gz

      - name: 🚀 Upload Device IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooKi-iOS-IPA
          path: apps/ki-reservation-mobile/build/ios/ipa/BooKi-iOS-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: 🚀 Upload Appetize.io Simulator Artifact (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: booki-appetize-iOS
          path: apps/ki-reservation-mobile/build/ios/iphonesimulator/booki-appetize-iOS.zip
          retention-days: 14
          if-no-files-found: error


